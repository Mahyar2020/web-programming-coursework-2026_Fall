<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Submit a student event to Campus Hub.">
    <title>Campus Hub - Submit an event</title>
  </head>
  <body>
    <a href="#main-content">Skip to main content</a>
    <header>
      <p><a href="./">Campus Hub</a></p>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="./">Home</a></li>
          <li><a href="#main-content">Submit an event</a></li>
        </ul>
      </nav>
    </header>
    <main id="main-content">
      <h1>Submit a campus event</h1>
      <form action="/events" method="post">
        <fieldset>
          <legend>Event details</legend>

          <label for="event-title">Event title</label>
          <input id="event-title" name="title" type="text" required>

          <label for="event-date">Event date</label>
          <input id="event-date" name="date" type="date" required>

          <label for="event-type">Event type</label>
          <select id="event-type" name="type" required>
            <option value="">Choose an event type</option>
            <option value="workshop">Workshop</option>
            <option value="seminar">Seminar</option>
            <option value="community">Community event</option>
          </select>

          <label for="event-description">Event description</label>
          <textarea id="event-description" name="description" rows="6" required></textarea>
        </fieldset>

        <fieldset>
          <legend>Organizer details</legend>

          <label for="organizer-name">Organizer name</label>
          <input id="organizer-name" name="organizer-name" type="text" autocomplete="name" required>

          <label for="organizer-email">Organizer email</label>
          <input id="organizer-email" name="organizer-email" type="email" autocomplete="email" required>
        </fieldset>

        <button type="submit">Submit event</button>
      </form>
    </main>
    <footer>
      <p>Campus Hub is a fictional student learning project.</p>
    </footer>
  </body>
</html>
